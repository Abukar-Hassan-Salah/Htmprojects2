
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css" />

</head>
<body>
  <main class="container">
    <form id="login-form" novalidate aria-labelledby="login-title">
      <h2 id="login-title">Welcome back</h2>
      <p class="subtitle">Please sign in to continue</p>

      <!-- Email -->
      <div class="form-control">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
        <p class="error" id="email-error" aria-live="polite"></p>
      </div>

      <!-- Password + toggle -->
      <div class="form-control">
        <div class="label-row">
          <label for="password">Password</label>
          <button type="button" id="toggle-pwd" class="link-btn" aria-controls="password" aria-pressed="false">Show</button>
        </div>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
          minlength="6"
        />
        <p class="error" id="password-error" aria-live="polite"></p>
      </div>

      <!-- Options -->
      <div class="row between">
        <label class="checkbox">
          <input type="checkbox" id="remember" name="remember" />
          <span>Remember me</span>
        </label>
        #Forgot password?
      </div>

      <!-- Submit -->
      <button type="submit" id="submit-btn">Sign in</button>

      <!-- Form-level message -->
      <p class="form-message" id="form-message" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
